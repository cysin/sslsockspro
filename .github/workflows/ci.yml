name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      reproducibility:
        description: Rebuild native engines twice and compare artifact digests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      # Actions are pinned to full commit SHAs; update the SHA and comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Cache toolchains and checksum-pinned sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/android-sdk
            .tools/jdk
            .tools/downloads
            .native
          key: toolchain-${{ runner.os }}-${{ hashFiles('build-dependencies.json', 'native-dependencies.json', 'tools/bootstrap.py', 'tools/build_tools.py', 'tools/build_native.py', 'app/src/main/cpp/**') }}
      - name: Cache verified Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/verification-metadata.xml', '**/*.lockfile') }}
      - name: Prepare SDK, NDK, JDK and native sources
        run: python3 tools/bootstrap.py
      - name: Unit tests, release lint and builds
        run: >-
          python3 tools/gradle.py --no-daemon
          :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
          :app:assembleMinifiedDebug :app:assembleDebugAndroidTest
      - name: Native reproducibility
        if: github.event_name == 'workflow_dispatch' && inputs.reproducibility
        run: |
          cp app/src/main/jniLibs/arm64-v8a/artifacts.json first-artifacts.json
          python3 tools/build_native.py --force
          diff first-artifacts.json app/src/main/jniLibs/arm64-v8a/artifacts.json
